spring.profiles.active=prod

# Base URL without wrapper prefix (wrapper is added in Java config)
app.datasource.url=postgresql://your-cluster.cluster-XYZ.us-east-1.rds.amazonaws.com:5432/xxx
app.datasource.username=xxx
app.datasource.password=xxx

app.datasource.hikari.maximum-pool-size=100
app.datasource.hikari.connection-timeout=30000
app.datasource.hikari.idle-timeout=300000
app.datasource.hikari.max-lifetime=1800000
app.datasource.hikari.leak-detection-threshold=30000
